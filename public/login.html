<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Afro Intelligent</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/auth.css"><link rel="stylesheet" href="/recovery.css"></head>
<body><main class="auth-shell"><header class="auth-top"><a class="brand" href="/"><span class="brand-mark">AI</span><span>AFRO <strong>INTELLIGENT</strong></span></a><a class="back-home" href="/">← Back to product</a></header><section class="auth-card login-card"><div class="login-icon">⌁</div><p class="eyebrow"><span></span> WELCOME BACK</p><p class="auth-success" id="login-success" role="status" hidden>Password updated successfully. You can now sign in.</p><div class="progress"><span id="progress"></span></div><form id="login-form"><div class="question"><p class="step-count" id="step-count"></p><h1 id="question">What is your business email?</h1><p id="helper">Use the email you registered with Afro Intelligent.</p><label id="label" for="answer">BUSINESS EMAIL</label><input id="answer" type="email" autocomplete="email" required autofocus><p class="forgot-link" id="forgot-link" hidden><a class="inline-link" href="/forgot-password">Forgot password?</a></p></div><p class="auth-error" id="error" role="alert"></p><div class="auth-actions"><button class="back-button" type="button" id="back" hidden>← Back</button><button class="next-button" type="submit" id="next"><span>Continue</span><b>→</b></button></div></form><div class="login-assurance"><span>✓</span><p>Your workspace uses secure account access. Need a new account? <a class="inline-link" href="/register">Start your workspace</a></p></div></section></main><script src="/login.js"></script></body></html>
